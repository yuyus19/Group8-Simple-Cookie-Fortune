{{/*
One template for both application services.

k8s/backend.yaml and k8s/frontend.yaml were about ninety percent the same
file. This loops over .Values.services instead, so the differences live in
values.yaml and there is only one place to fix when something is wrong.
*/}}
{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "fortune-cookie.labels" $ | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: {{ $.Values.revisionHistoryLimit }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: {{ $.Values.rollingUpdate.maxSurge }}
      maxUnavailable: {{ $.Values.rollingUpdate.maxUnavailable }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
        {{- include "fortune-cookie.labels" $ | nindent 8 }}
      {{- if $.Values.metrics.enabled }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ $svc.port | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- if and $svc.waitForRedis $.Values.redis.enabled }}
      initContainers:
        - name: wait-for-redis
          image: {{ $.Values.redis.image }}
          command:
            - sh
            - -c
            - until redis-cli -h redis -p {{ $.Values.redis.port }} ping; do echo "waiting for redis..."; sleep 2; done
      {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "fortune-cookie.image" (dict "root" $ "service" $name) }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ $svc.port }}
          {{- with $svc.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: {{ $svc.probePath }}
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.probePath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          securityContext:
            {{- toYaml $.Values.securityContext | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    app.kubernetes.io/name: {{ $name }}
    {{- include "fortune-cookie.labels" $ | nindent 4 }}
spec:
  type: {{ $svc.service.type }}
  selector:
    app.kubernetes.io/name: {{ $name }}
    app.kubernetes.io/instance: {{ $.Release.Name }}
  ports:
    - name: http
      port: {{ $svc.port }}
      targetPort: http
      {{- if and (eq $svc.service.type "NodePort") $svc.service.nodePort }}
      nodePort: {{ $svc.service.nodePort }}
      {{- end }}
{{- end }}
