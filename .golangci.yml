# golangci-lint configuration, shared by the backend and the frontend module.
#
# The config lives at the repository root and golangci-lint searches upward,
# so running it from either service directory picks this up.
#
# This is the v1 schema. golangci-lint-action@v6 installs golangci-lint 1.x,
# and 1.x rejects the v2 layout with "the configuration contains invalid
# elements" rather than ignoring it.

run:
  timeout: 5m

linters:
  # On top of the defaults: errcheck, gosimple, govet, ineffassign,
  # staticcheck and unused.
  enable:
    - misspell

linters-settings:
  errcheck:
    # Writing to an http.ResponseWriter returns an error that essentially
    # nobody checks, because there is nothing useful to do about it: the
    # response is already on its way out. Checking these would mean noise on
    # every handler in the codebase for no benefit.
    exclude-functions:
      - (net/http.ResponseWriter).Write
      - fmt.Fprint
      - fmt.Fprintf
      - io.WriteString

issues:
  exclude-rules:
    # The test helpers read a body into a fixed buffer on purpose.
    - path: _test\.go
      linters:
        - errcheck
