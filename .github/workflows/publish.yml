name: Publish images

# Ships both services to Docker Hub.
#
# This needs two repository secrets, because Docker Hub is not part of GitHub
# and the built in GITHUB_TOKEN means nothing to it:
#
#   DOCKERHUB_USERNAME  the Docker Hub account, jimdaf
#   DOCKERHUB_TOKEN     a personal access token with Read and Write
#
# Only a repository admin can add those, so ask Yusuf if the login step fails.

on:
  push:
    branches:
      - main
      - 'ci/**'
  pull_request:
    branches:
      - main

permissions:
  contents: read
  # Lets Trivy upload its findings to the Security tab.
  security-events: write

env:
  # Docker Hub only allows one level of naming under an account, so the two
  # services get a suffix instead of sitting under a shared folder.
  IMAGE_NAMESPACE: jimdaf
  IMAGE_BASE: cookie-fortune-group08

jobs:
  publish:
    name: Build and push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - backend
          - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Confirm the Docker Hub secrets are set
        # Without this the run dies inside docker login with a confusing
        # "unauthorized" and no hint about what is actually missing.
        if: ${{ github.event_name != 'pull_request' }}
        env:
          USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          if [ -z "$USERNAME" ] || [ -z "$TOKEN" ]; then
            echo "Missing DOCKERHUB_USERNAME or DOCKERHUB_TOKEN."
            echo "A repository admin adds them under"
            echo "Settings, Secrets and variables, Actions, New repository secret."
            exit 1
          fi
          echo "Both secrets are present."

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        # Pull requests from a fork cannot read secrets, so those runs build
        # only and never push.
        if: ${{ github.event_name != 'pull_request' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Work out the image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: docker.io/${{ env.IMAGE_NAMESPACE }}/${{ env.IMAGE_BASE }}-${{ matrix.service }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          # Load it into the local docker so Trivy can scan the exact image
          # that was just built, including on pull requests where nothing is
          # pushed anywhere.
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Work out one tag to scan
        id: scan_target
        run: |
          # metadata-action emits several tags, one per line. Trivy wants one.
          echo "image=$(echo '${{ steps.meta.outputs.tags }}' | head -1)" >> "$GITHUB_OUTPUT"

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan_target.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.service }}.sarif
          severity: HIGH,CRITICAL
          # Report only. The base images are ours to patch on our own
          # schedule, and a new CVE published overnight should not block a
          # deploy that fixes something else. The findings still land in the
          # Security tab where they can be looked at.
          exit-code: "0"
          ignore-unfixed: true

      - name: Upload the Trivy findings
        uses: github/codeql-action/upload-sarif@v3
        # Runs even if the scan step failed, so a broken scan is visible.
        if: ${{ always() }}
        with:
          sarif_file: trivy-${{ matrix.service }}.sarif
          category: trivy-${{ matrix.service }}

      - name: Show the findings in the log as well
        if: ${{ always() }}
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.scan_target.outputs.image }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

  pull-and-verify:
    name: Pull from Docker Hub and run it
    needs: publish
    # Nothing was pushed on a pull request, so there is nothing to pull back.
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Work out the tag that was just pushed
        id: tag
        run: echo "value=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Pull the images we just published
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker compose pull

      - name: Start the pulled images
        env:
          TAG: ${{ steps.tag.outputs.value }}
        # --no-build is the whole point of this job. It proves the app runs
        # from what Docker Hub holds and not from a local build.
        run: docker compose up -d --no-build --wait

      - name: Check the app answers
        run: |
          curl -fsS http://localhost:8080/healthz
          echo
          curl -fsS http://localhost:8080/api/random
          echo

      - name: Show what is running
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker compose ps

      - name: Stop everything
        if: always()
        env:
          TAG: ${{ steps.tag.outputs.value }}
        run: docker compose down
