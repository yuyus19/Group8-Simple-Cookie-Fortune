name: CD

# Continuous delivery. Takes the images that publish.yml pushed to Docker Hub
# and puts them on a Kubernetes cluster.
#
# The pipeline is staging first, then production, and production only happens
# if the functional tests passed against staging. That is the "deploy to
# production if functional tests pass" item from 05-bon-appetit: the smoke
# tests are a gate, not a report.
#
# Which cluster depends on whether a KUBECONFIG secret exists:
#
#   secret set     deploy to that cluster, which is the real thing the
#                  exercise describes
#   secret absent  create a throwaway kind cluster inside the runner and
#                  deploy there instead, so the script is still exercised
#                  end to end on every push
#
# Adding the secret later switches it over with no change to this file. To
# create it run scripts/set-kubeconfig-secret.sh, or by hand:
#
#   cat ~/.kube/config | base64 -w0
#
# and save the output as a repository secret called KUBECONFIG. The cluster
# has to be reachable from the internet for that path to work, so a local
# Docker Desktop or kind cluster will not do.

on:
  push:
    branches:
      - main
      - 'cd-**'
  workflow_dispatch:
    inputs:
      soft_fail:
        description: >-
          Run the smoke tests without letting them fail the deploy. Off by
          default, so a broken deploy stops here rather than being announced
          as a success.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy and verify
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Work out which cluster to use
        id: target
        env:
          KUBECONFIG_SECRET: ${{ secrets.KUBECONFIG }}
        run: |
          if [ -n "$KUBECONFIG_SECRET" ]; then
            echo "have_kubeconfig=true" >> "$GITHUB_OUTPUT"
            echo "Deploying to the cluster in the KUBECONFIG secret."
          else
            echo "have_kubeconfig=false" >> "$GITHUB_OUTPUT"
            echo "No KUBECONFIG secret, so a kind cluster will be created here."
          fi

      - name: Create a throwaway kind cluster
        if: ${{ steps.target.outputs.have_kubeconfig == 'false' }}
        uses: helm/kind-action@v1
        with:
          cluster_name: fortune-cookie
          config: k8s/kind-cluster.yaml

      # ---------------------------------------------------------- staging ---

      - name: Deploy to staging
        id: staging
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
          ENVIRONMENT: staging
          IMAGE_TAG: latest
        run: ./scripts/deploy.sh

      - name: Smoke test staging
        env:
          NS: ${{ steps.staging.outputs.namespace }}
          SOFT_FAIL: ${{ inputs.soft_fail && 'true' || 'false' }}
          BASE_URL: http://localhost:18080
          WAIT_SECONDS: "90"
        run: |
          # A port forward works the same against kind and against a real
          # remote cluster, unlike a NodePort which needs network access to
          # the nodes themselves.
          kubectl -n "$NS" port-forward svc/frontend 18080:8080 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT

          ./scripts/smoke-test.sh

      - name: Load test staging with siege
        # Informational rather than a gate. Runner performance varies a lot
        # between runs, so a slow agent should not block a release, but a
        # sudden drop in availability is worth having in the log.
        continue-on-error: true
        env:
          NS: ${{ steps.staging.outputs.namespace }}
          BASE_URL: http://localhost:18081
          CONCURRENT: "25"
          DURATION: 20S
        run: |
          kubectl -n "$NS" port-forward svc/frontend 18081:8080 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT
          sleep 3

          ./scripts/stress-test.sh

      # ------------------------------------------------------- production ---

      # Only main reaches production, and only because every step above
      # succeeded. A failed smoke test stops the job before this point, which
      # is exactly the gate the exercise asks for.
      - name: Deploy to production
        id: production
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
          ENVIRONMENT: production
          IMAGE_TAG: latest
        run: ./scripts/deploy.sh

      - name: Smoke test production
        if: ${{ github.ref == 'refs/heads/main' }}
        env:
          NS: ${{ steps.production.outputs.namespace }}
          SOFT_FAIL: ${{ inputs.soft_fail && 'true' || 'false' }}
          BASE_URL: http://localhost:18082
          WAIT_SECONDS: "90"
        run: |
          kubectl -n "$NS" port-forward svc/frontend 18082:8080 &
          PF=$!
          trap 'kill $PF 2>/dev/null || true' EXIT

          ./scripts/smoke-test.sh

      # If production went out and then failed its tests, put the previous
      # version back instead of leaving it broken while somebody investigates.
      - name: Roll production back if its smoke tests failed
        if: ${{ failure() && github.ref == 'refs/heads/main' && steps.production.outcome == 'success' }}
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG }}
          ENVIRONMENT: production
        run: ./scripts/rollback.sh

      - name: Show what was deployed
        if: ${{ always() }}
        run: |
          echo "staging namespace:    ${{ steps.staging.outputs.namespace }}"
          echo "production namespace: ${{ steps.production.outputs.namespace }}"
          kubectl get deployments,pods --all-namespaces \
            -l app.kubernetes.io/part-of=cookie-fortune -o wide || true
