apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: fortune
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cookie-fortune
spec:
  # 2 replicas, which only became safe once the app was fixed. List() now
  # reads through to Redis on every call instead of answering from a private
  # in-memory map, and foredis.go uses a connection pool rather than one
  # shared connection that was never safe for concurrent use. Both replicas
  # therefore see the same fortunes.
  replicas: 2
  # Keep enough old ReplicaSets around for scripts/rollback.sh to have
  # somewhere to roll back to.
  revisionHistoryLimit: 5
  strategy:
    # Rolling, so a release never takes the service down. maxUnavailable 0
    # means the new pod has to pass its readiness probe before an old one is
    # removed, so there is always at least one backend answering.
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
        app.kubernetes.io/part-of: cookie-fortune
      annotations:
        # How the Prometheus in k8s/monitoring finds this pod.
        prometheus.io/scrape: "true"
        prometheus.io/port: "9000"
        prometheus.io/path: /metrics
    spec:
      # Compose can say "wait until Redis is healthy". Kubernetes cannot order
      # pods, and this particular race is silent rather than loud: init() in
      # foredis.go retries for about ten seconds, then gives up for good and
      # serves from the in-memory map without ever crashing. So the kubelet
      # would never restart it, and the cookies would keep vanishing with no
      # error anywhere. An init container is what actually holds it back.
      initContainers:
        - name: wait-for-redis
          image: redis:7.2-alpine
          command:
            - sh
            - -c
            - until redis-cli -h redis -p 6379 ping; do echo "waiting for redis..."; sleep 2; done
      containers:
        - name: backend
          image: docker.io/jimdaf/cookie-fortune-group08-backend:latest
          # The workers have no local copy of this image, so it is always
          # pulled from Docker Hub. With a moving tag like :latest, Always
          # avoids serving a stale cached layer after a new push.
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 9000
          env:
            # "redis" is the Service name in k8s/redis.yaml. Setting this is
            # the entire fix for 04-database: foredis.go checks for it and
            # only then talks to Redis instead of its in-memory map.
            - name: REDIS_DNS
              value: redis
          # The backend has a real /healthz now, added test first in
          # 05-bon-appetit, so the probes no longer have to borrow /fortunes.
          #
          # Worth knowing why both probes use it: /healthz deliberately does
          # not check Redis. A liveness probe that failed when the database
          # blipped would have the kubelet restart a perfectly healthy pod and
          # turn a small Redis outage into a full application outage.
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
          securityContext:
            # The Dockerfile says "USER app", a name. Kubernetes only resolves
            # numeric ids, so with runAsNonRoot alone the kubelet refuses the
            # container: "image has non-numeric user (app), cannot verify user
            # is non-root". Restating the uid from the Dockerfile's
            # "adduser -D -u 10001 app" is what makes it startable.
            runAsUser: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: fortune
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: cookie-fortune
spec:
  # ClusterIP: reachable only inside the cluster, which is all the frontend
  # needs. The name "backend" is what in-cluster DNS resolves, so the
  # frontend's BACKEND_DNS can stay exactly as it is in docker-compose.yml.
  type: ClusterIP
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 9000
      targetPort: http
