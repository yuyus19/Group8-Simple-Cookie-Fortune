services:
  backend:
    build:
      context: ./backend
    # Naming the registry image here means "docker compose pull" fetches the
    # one our workflow published instead of quietly reusing a local build.
    # Set TAG to pin an exact build, for example TAG=sha-1a2b3c4.
    image: jimdaf/cookie-fortune-group08-backend:${TAG:-latest}
    restart: unless-stopped
    expose:
      - "9000"
    environment:
      # This one variable is the whole bug. backend/foredis.go only opens a
      # Redis connection when REDIS_DNS is set. Without it the backend keeps
      # fortunes in a plain Go map, so every redeploy starts from scratch.
      REDIS_DNS: redis
    depends_on:
      # Has to be service_healthy, not just started. init() in foredis.go
      # tries five times over about ten seconds and then gives up for good,
      # quietly falling back to the in memory map instead of crashing. A
      # backend that wins the race against Redis looks perfectly fine while
      # dropping every write.
      redis:
        condition: service_healthy
    healthcheck:
      # The backend has no /healthz yet, so we use a real endpoint instead.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/fortunes"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    image: jimdaf/cookie-fortune-group08-frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Service name resolves over the compose network, so this is all the
      # frontend needs to find the backend.
      BACKEND_DNS: backend
      BACKEND_PORT: "9000"
    depends_on:
      # Not just "started". The frontend handlers call log.Fatalln() when a
      # request to the backend fails, which kills the whole process, so it must
      # not come up until the backend is actually answering.
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    # appendonly writes every change to disk as it happens. The default only
    # snapshots now and then, so a crash can still lose the last few cookies.
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 3s

volumes:
  # A named volume, so the cookies outlive "docker compose down" as well.
  redis-data:
