services:
  backend:
    build:
      context: ./backend
    # Naming the registry image here means "docker compose pull" fetches the
    # one our workflow published instead of quietly reusing a local build.
    # Set TAG to pin an exact build, for example TAG=sha-1a2b3c4.
    image: ghcr.io/yuyus19/cookie-fortune-group08/backend:${TAG:-latest}
    restart: unless-stopped
    expose:
      - "9000"
    healthcheck:
      # The backend has no /healthz yet, so we use a real endpoint instead.
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9000/fortunes"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    image: ghcr.io/yuyus19/cookie-fortune-group08/frontend:${TAG:-latest}
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Service name resolves over the compose network, so this is all the
      # frontend needs to find the backend.
      BACKEND_DNS: backend
      BACKEND_PORT: "9000"
    depends_on:
      # Not just "started". The frontend handlers call log.Fatalln() when a
      # request to the backend fails, which kills the whole process, so it must
      # not come up until the backend is actually answering.
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
